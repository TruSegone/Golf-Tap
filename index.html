<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golf Tap — Browser Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071c12; color: #f7fbef; }
    main { width: min(100%, 880px); padding: 24px 16px 36px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0 0 8px; color: #f6d451; font-size: clamp(2rem, 6vw, 3.3rem); text-shadow: 0 3px 0 #123d18; }
    p { margin: 0 auto 18px; max-width: 650px; color: #cfe8cf; line-height: 1.5; }
    #frame { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 14px; box-shadow: 0 18px 54px #000a; border: 3px solid #8bc34a; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    #banner { position: absolute; inset: 0; display: grid; place-items: center; background: #062313cc; font-size: clamp(1.2rem, 3vw, 2rem); font-weight: bold; pointer-events: none; opacity: 0; transition: opacity .2s; }
    #banner.show { opacity: 1; }
    .note { margin-top: 14px; font-size: .9rem; color: #9dc5a1; }
  </style>
</head>
<body>
  <main>
    <h1>GOLF TAP</h1>
    <p>A playable browser preview. Aim with your pointer, hold to charge, and release to shoot. Keep it controlled near the cup.</p>
    <div id="frame"><canvas id="game" width="800" height="600" aria-label="Golf Tap browser preview"></canvas><div id="banner"></div></div>
    <div class="note">Desktop version: Java + libGDX. Browser preview is provided for quick reviewer feedback.</div>
  </main>
  <script>
    const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d'), banner = document.querySelector('#banner');
    const bg = new Image(); bg.src = 'assets/gameplay_background.png';
    // Start directly on the large tee ball painted into the course artwork.
    const TEE = { x: 130, y: 475 };
    const ball = { x: TEE.x, y: TEE.y, vx: 0, vy: 0, r: 10 }; const hole = { x: 650, y: 130, r: 15 };
    let aim = { x: 1, y: 0 }, charging = false, power = 0, shots = 0, last = performance.now(), won = false, over = false;
    const water = { x: 570, y: 315, w: 215, h: 285 }, sand = { x: 52, y: 147, w: 176, h: 205 }, rough = { x: 395, y: 227, w: 165, h: 118 };
    const inside = (p, r) => p.x > r.x && p.x < r.x+r.w && p.y > r.y && p.y < r.y+r.h;
    const reset = () => { Object.assign(ball, {x:TEE.x,y:TEE.y,vx:0,vy:0}); power=0; shots=0; won=false; over=false; charging=false; banner.className=''; };
    function pointer(e) { const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*600/r.height}; }
    canvas.addEventListener('pointermove', e => { if (ball.vx || ball.vy || won || over) return; const p=pointer(e), dx=p.x-ball.x, dy=p.y-ball.y, d=Math.hypot(dx,dy); if(d>4) aim={x:dx/d,y:dy/d}; });
    canvas.addEventListener('pointerdown', e => { if (!ball.vx&&!ball.vy&&!won&&!over) { charging=true; power=0; canvas.setPointerCapture(e.pointerId); } });
    canvas.addEventListener('pointerup', () => shoot());
    addEventListener('keydown', e => { if(e.key===' '){e.preventDefault(); if(!charging&&!ball.vx&&!ball.vy) charging=true;} if(e.key.toLowerCase()==='r') reset(); });
    addEventListener('keyup', e => { if(e.key===' ') shoot(); });
    function shoot(){ if(!charging) return; charging=false; if(power<.03) return; shots++; ball.vx=aim.x*(180+720*power); ball.vy=aim.y*(180+720*power); power=0; }
    function message(text){ banner.textContent=text; banner.className='show'; setTimeout(()=>banner.className='', 1300); }
    function update(dt){
      if(charging) power=Math.min(1,power+dt/1.2); if(!ball.vx&&!ball.vy||won||over) return;
      ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      if(inside(ball,water)){ ball.x=TEE.x; ball.y=TEE.y; ball.vx=ball.vy=0; message('Splash! Back to the tee.'); if(shots>=8){over=true; message('GAME OVER — Press R to retry');} return; }
      const speed=Math.hypot(ball.vx,ball.vy), decel=inside(ball,sand)?650:inside(ball,rough)?380:220, next=Math.max(0,speed-decel*dt);
      if(speed) { ball.vx*=next/speed; ball.vy*=next/speed; } if(next<8){ball.vx=ball.vy=0; if(shots>=8){over=true; message('GAME OVER — Press R to retry');}}
      if(ball.x<20||ball.x>780){ball.x=Math.max(20,Math.min(780,ball.x));ball.vx*=-.65;} if(ball.y<25||ball.y>575){ball.y=Math.max(25,Math.min(575,ball.y));ball.vy*=-.65;}
      if(Math.hypot(ball.x-hole.x,ball.y-hole.y)<16 && next<=110){won=true;ball.vx=ball.vy=0;message(`VICTORY! Hole complete in ${shots} shots`);}
    }
    function draw(){
      ctx.clearRect(0,0,800,600); if(bg.complete) {
        ctx.drawImage(bg,0,0,800,600);
        // The source artwork has a ball baked into the tee. Patch that small spot
        // with nearby tee grass so the single physics ball can move away cleanly.
        ctx.drawImage(bg, 112, 492, 26, 24, 117, 463, 26, 24);
      } else {ctx.fillStyle='#438b28';ctx.fillRect(0,0,800,600);}
      ctx.fillStyle='rgba(2,20,12,.72)';ctx.fillRect(12,12,776,56); ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.fillText(`HOLE 1   PAR 5   SHOTS ${shots}/8`,28,35);ctx.fillText(`TERRAIN: ${inside(ball,sand)?'Sand':inside(ball,rough)?'Rough':'Fairway'}`,28,58);ctx.fillText(`POWER ${Math.round(power*100)}%`,645,35);ctx.font='15px Arial';ctx.fillText('Move to aim | Hold to charge | Release to shoot',456,58);
      ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(ball.x,ball.y+10,11,4,0,0,Math.PI*2);ctx.fill();
      if(!ball.vx&&!ball.vy&&!won&&!over){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+aim.x*70,ball.y+aim.y*70);ctx.stroke();}
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#455';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#dce7e7';ctx.beginPath();ctx.arc(ball.x-3,ball.y-3,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(3,28,17,.78)';ctx.fillRect(260,565,280,22);ctx.fillStyle='#54d363';ctx.fillRect(263,568,274*power,16);
      requestAnimationFrame(frame);
    }
    function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();} requestAnimationFrame(frame);
  </script>
</body>
</html>
